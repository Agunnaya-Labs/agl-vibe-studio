<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agunnaya Labs Studio</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 400px;
      background: #050505;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      font-size: 14px;
    }

    .header {
      background: linear-gradient(135deg, #0052FF 0%, #A855F7 100%);
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header img {
      width: 32px;
      height: 32px;
      border-radius: 8px;
    }

    .header h1 {
      font-size: 16px;
      font-weight: 600;
    }

    .content {
      padding: 16px;
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      margin: 8px 0;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s;
      color: #e0e0e0;
      text-decoration: none;
    }

    .menu-item:hover {
      background-color: #1a1a1a;
    }

    .menu-item icon {
      width: 20px;
      height: 20px;
      display: inline-block;
    }

    .btn-group {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }

    .btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s;
    }

    .btn-primary {
      background: linear-gradient(135deg, #0052FF 0%, #A855F7 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(0, 82, 255, 0.3);
    }

    .btn-secondary {
      background: #1a1a1a;
      color: #e0e0e0;
      border: 1px solid #333;
    }

    .btn-secondary:hover {
      background: #2a2a2a;
    }

    .divider {
      height: 1px;
      background: #1a1a1a;
      margin: 12px 0;
    }

    .footer {
      padding: 12px 16px;
      border-top: 1px solid #1a1a1a;
      font-size: 12px;
      color: #888;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="../../images/brand/agunnaya-logo.png" alt="Agunnaya">
    <div>
      <h1>Agunnaya Studio</h1>
      <p style="font-size: 12px; opacity: 0.8;">Web3 Creation Engine</p>
    </div>
  </div>

  <div class="content">
    <div class="menu-item" id="open-studio">
      <span>🚀</span>
      <span>Open Studio</span>
    </div>
    <div class="menu-item" id="create-contract">
      <span>⚙️</span>
      <span>Create Contract</span>
    </div>
    <div class="menu-item" id="explore-tokens">
      <span>💱</span>
      <span>Explore Tokens</span>
    </div>
    <div class="menu-item" id="create-nft">
      <span>🎨</span>
      <span>Create NFT</span>
    </div>
    <div class="menu-item" id="build-dao">
      <span>🏛️</span>
      <span>Build DAO</span>
    </div>

    <div class="divider"></div>

    <div class="menu-item" id="docs">
      <span>📚</span>
      <span>Documentation</span>
    </div>
    <div class="menu-item" id="settings">
      <span>⚙️</span>
      <span>Settings</span>
    </div>

    <div class="btn-group">
      <button class="btn btn-primary" id="launch-btn">Launch</button>
      <button class="btn btn-secondary" id="docs-btn">Docs</button>
    </div>
  </div>

  <div class="footer">
    <p>v1.0.0 • Built on Base Network</p>
  </div>

  <script src="popup.js"></script>
</body>
</html>
